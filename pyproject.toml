[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cupola"
version = "0.1.0"
description = "Local inference supervisor for AMD ROCm workstations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CUPOLA Contributors"}]
keywords = ["llama.cpp", "rocm", "inference", "supervisor", "gguf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
homepage = "https://github.com/xyzzing/cupola"
repository = "https://github.com/xyzzing/cupola"

[project.scripts]
cupola = "cupola.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_hardware: requires the real GPU/backend; skipped in CI",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cupola"]